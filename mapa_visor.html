
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Monitor CSA - Tiempo Real</title>
            <style>
                body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; }
                iframe { width: 100%; height: 100%; border: none; }
                #ui { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.8); color: #00ff00; 
                       padding: 10px 15px; border-radius: 8px; font-family: 'Courier New', monospace; 
                       font-size: 12px; z-index: 1000; border: 1px solid #333; }
            </style>
        </head>
        <body>
            <div id="ui">🛰️ SISTEMA ACTIVO<br><span id="clock">Cargando...</span></div>
            <iframe id="mapa" src="mapa_contenido.html"></iframe>
            
            <script>
                setInterval(function() {
                    var ifr = document.getElementById('mapa');
                    // Recargamos solo el iframe usando un truco de fecha para que no use la caché
                    ifr.src = "mapa_contenido.html?v=" + new Date().getTime();
                    document.getElementById('clock').innerHTML = "ACTUALIZADO: " + new Date().toLocaleTimeString();
                }, 5000);
            </script>
        </body>
        </html>
