
        <html>
        <head>
            <title>Visor CSA</title>
            <style>body, html { margin:0; padding:0; height:100%; overflow:hidden; }</style>
        </head>
        <body>
            <iframe id="frame" src="mapa_datos.html" style="width:100%; height:100%; border:none;"></iframe>
            <script>
                setInterval(function() {
                    // Forzamos la recarga del iframe añadiendo un parámetro de tiempo
                    document.getElementById('frame').src = "mapa_datos.html?cache=" + new Date().getTime();
                    console.log("Recargando datos...");
                }, 4000);
            </script>
        </body>
        </html>
